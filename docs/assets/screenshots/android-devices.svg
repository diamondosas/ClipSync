<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 580" width="320" height="580">
  <defs>
    <linearGradient id="androidBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#120A05"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Phone Bezel & Screen -->
  <rect width="320" height="580" rx="32" fill="#1C120B" stroke="#5A3416" stroke-width="2"/>
  <rect x="8" y="8" width="304" height="564" rx="26" fill="url(#androidBg)"/>

  <!-- Phone Notch / Camera -->
  <circle cx="160" cy="24" r="5" fill="#000000" stroke="#362214" stroke-width="1.5"/>

  <!-- App Header / AppBar -->
  <rect x="8" y="44" width="304" height="50" fill="#1C120B" stroke="#362214" stroke-width="1"/>
  <text x="24" y="74" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">ClipSync</text>
  <circle cx="280" cy="69" r="6" fill="#2ECC71" filter="url(#amberGlow)"/>

  <!-- Radar / Scanning Section -->
  <circle cx="160" cy="180" r="65" fill="none" stroke="#5A3416" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="160" cy="180" r="45" fill="none" stroke="#C67628" stroke-width="1.5" opacity="0.6"/>
  <circle cx="160" cy="180" r="25" fill="#362214" stroke="#C67628" stroke-width="2"/>
  <text x="160" y="184" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Scanning</text>
  <text x="160" y="270" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Discovered Devices (2)</text>

  <!-- Device Card 1 -->
  <g transform="translate(24, 290)">
    <rect width="272" height="68" rx="10" fill="#362214" stroke="#C67628" stroke-width="1.2"/>
    <circle cx="28" cy="34" r="14" fill="#5A3416"/>
    <!-- Laptop icon -->
    <rect x="20" y="26" width="16" height="11" rx="1" fill="#FFF6EC"/>
    <line x1="18" y1="39" x2="38" y2="39" stroke="#FFF6EC" stroke-width="1.5"/>
    
    <text x="52" y="28" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Ubuntu-Desktop</text>
    <text x="52" y="46" fill="#DAC9B9" font-family="monospace" font-size="11">192.168.1.105:9999</text>
    <circle cx="250" cy="34" r="5" fill="#2ECC71"/>
  </g>

  <!-- Device Card 2 -->
  <g transform="translate(24, 370)">
    <rect width="272" height="68" rx="10" fill="#1C120B" stroke="#362214" stroke-width="1"/>
    <circle cx="28" cy="34" r="14" fill="#362214"/>
    <!-- Windows PC icon -->
    <rect x="20" y="26" width="16" height="11" rx="1" fill="#DAC9B9"/>
    <line x1="18" y1="39" x2="38" y2="39" stroke="#DAC9B9" stroke-width="1.5"/>

    <text x="52" y="28" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Windows-Laptop</text>
    <text x="52" y="46" fill="#DAC9B9" font-family="monospace" font-size="11">192.168.1.142:9999</text>
    <circle cx="250" cy="34" r="5" fill="#2ECC71"/>
  </g>

  <!-- Bottom Navigation Bar -->
  <rect x="8" y="500" width="304" height="60" rx="0" fill="#1C120B" stroke="#362214" stroke-width="1"/>
  
  <!-- Active Devices Tab -->
  <rect x="36" y="510" width="100" height="40" rx="8" fill="#362214" stroke="#C67628" stroke-width="1"/>
  <text x="86" y="534" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">● Devices</text>

  <!-- Inactive Clipboard Tab -->
  <text x="220" y="534" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Clipboard</text>
</svg>
