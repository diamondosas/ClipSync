<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 580" width="320" height="580">
  <defs>
    <linearGradient id="androidBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#120A05"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Phone Bezel & Screen -->
  <rect width="320" height="580" rx="32" fill="#1C120B" stroke="#5A3416" stroke-width="2"/>
  <rect x="8" y="8" width="304" height="564" rx="26" fill="url(#androidBg)"/>

  <!-- Phone Notch / Camera -->
  <circle cx="160" cy="24" r="5" fill="#000000" stroke="#362214" stroke-width="1.5"/>

  <!-- App Header / AppBar -->
  <rect x="8" y="44" width="304" height="50" fill="#1C120B" stroke="#362214" stroke-width="1"/>
  <text x="24" y="74" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">ClipSync</text>
  <circle cx="280" cy="69" r="6" fill="#2ECC71" filter="url(#amberGlow)"/>

  <!-- Search & Clear Bar -->
  <g transform="translate(24, 105)">
    <rect width="272" height="38" rx="19" fill="#1C120B" stroke="#5A3416" stroke-width="1"/>
    <text x="36" y="24" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="12">Search clips...</text>
    <circle cx="24" cy="19" r="4" fill="none" stroke="#DAC9B9" stroke-width="1.2"/>
    <line x1="27" y1="22" x2="31" y2="26" stroke="#DAC9B9" stroke-width="1.2"/>
  </g>

  <!-- Pinned Clip Card (Bronze glow) -->
  <g transform="translate(24, 155)">
    <rect width="272" height="95" rx="10" fill="#5A3416" stroke="#C67628" stroke-width="1.2"/>
    <text x="16" y="25" fill="#FFF6EC" font-family="monospace" font-size="12" font-weight="bold">https://github.com/DiamondOsas...</text>
    <text x="16" y="45" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="11">ClipSync repository link for sharing</text>
    
    <!-- Meta Footer -->
    <text x="16" y="80" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="10">📌 Pinned • From Ubuntu-Desktop</text>
    
    <!-- Tap to Copy Badge -->
    <rect x="200" y="65" width="60" height="20" rx="4" fill="#C67628"/>
    <text x="230" y="79" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">COPY</text>
  </g>

  <!-- Unpinned Clip Card 1 -->
  <g transform="translate(24, 260)">
    <rect width="272" height="85" rx="10" fill="#362214" stroke="#362214" stroke-width="1"/>
    <text x="16" y="25" fill="#FFF6EC" font-family="monospace" font-size="12">sudo apt install wl-clipboard</text>
    <text x="16" y="45" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="11">Wayland clipboard support tool</text>
    <text x="16" y="70" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="10">2m ago • From Windows-Laptop</text>
    
    <rect x="200" y="55" width="60" height="20" rx="4" fill="#1C120B" stroke="#5A3416" stroke-width="1"/>
    <text x="230" y="69" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">COPY</text>
  </g>

  <!-- Unpinned Clip Card 2 -->
  <g transform="translate(24, 355)">
    <rect width="272" height="85" rx="10" fill="#1C120B" stroke="#362214" stroke-width="1"/>
    <text x="16" y="25" fill="#FFF6EC" font-family="monospace" font-size="12">Verification Code: 894-201</text>
    <text x="16" y="45" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="11">Copied from browser session</text>
    <text x="16" y="70" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="10">10m ago • Local Clipboard</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <rect x="8" y="500" width="304" height="60" rx="0" fill="#1C120B" stroke="#362214" stroke-width="1"/>
  
  <!-- Inactive Devices Tab -->
  <text x="86" y="534" fill="#DAC9B9" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Devices</text>

  <!-- Active Clipboard Tab -->
  <rect x="170" y="510" width="100" height="40" rx="8" fill="#362214" stroke="#C67628" stroke-width="1"/>
  <text x="220" y="534" fill="#FFF6EC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">● Clipboard</text>
</svg>
