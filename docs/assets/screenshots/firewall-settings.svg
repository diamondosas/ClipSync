<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140C07"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
  </defs>

  <rect width="540" height="320" rx="12" fill="url(#termBg)" stroke="#C67628" stroke-width="1.5"/>
  
  <!-- Terminal Topbar -->
  <rect width="540" height="36" rx="12" fill="#1F130A"/>
  <rect y="24" width="540" height="12" fill="#1F130A"/>
  <circle cx="20" cy="18" r="5" fill="#DC4B3C"/>
  <circle cx="36" cy="18" r="5" fill="#F1C40F"/>
  <circle cx="52" cy="18" r="5" fill="#2ECC71"/>
  <text x="270" y="23" fill="#DAC9B9" font-family="monospace" font-size="12" text-anchor="middle">ClipSync Network Ports Configuration</text>

  <!-- Content Lines -->
  <g transform="translate(24, 60)" font-family="monospace" font-size="13">
    <!-- Rule 1 -->
    <text x="0" y="20" fill="#C67628">$</text>
    <text x="18" y="20" fill="#FFF6EC">sudo ufw allow 9999/udp</text>
    <text x="18" y="42" fill="#2ECC71">Rule added: ClipSync KCP/UDP Encrypted Sync (v4/v6)</text>

    <!-- Rule 2 -->
    <text x="0" y="80" fill="#C67628">$</text>
    <text x="18" y="80" fill="#FFF6EC">sudo ufw allow 5353/udp</text>
    <text x="18" y="102" fill="#2ECC71">Rule added: mDNS / Zeroconf Automatic Discovery</text>

    <!-- Status -->
    <text x="0" y="140" fill="#C67628">$</text>
    <text x="18" y="140" fill="#FFF6EC">sudo ufw status | grep 9999</text>
    
    <rect x="18" y="155" width="480" height="48" rx="6" fill="#2B1A0E" stroke="#5A3416" stroke-width="1"/>
    <text x="32" y="176" fill="#FFF6EC" font-size="12">9999/udp (v4/v6)</text>
    <text x="260" y="176" fill="#2ECC71" font-size="12" font-weight="bold">ALLOW IN</text>
    <text x="390" y="176" fill="#DAC9B9" font-size="12">Local Subnet</text>

    <text x="32" y="194" fill="#FFF6EC" font-size="12">5353/udp (mDNS)</text>
    <text x="260" y="194" fill="#2ECC71" font-size="12" font-weight="bold">ALLOW IN</text>
    <text x="390" y="194" fill="#DAC9B9" font-size="12">Multicast</text>

    <text x="0" y="235" fill="#DAC9B9" font-size="11">✓ Both devices on same Wi-Fi will now auto-pair immediately.</text>
  </g>
</svg>
