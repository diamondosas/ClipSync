plugins { 
    id 'com.android.application' 
}

android {
    namespace 'com.example.javaapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.javaapp"
        minSdk 21          // Raise if manifest merger conflicts occur
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation files('libs/gioapp.aar')
}
