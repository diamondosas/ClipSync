name: Android Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "Setting up Android SDK environment..."
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> $GITHUB_ENV
          echo "${ANDROID_SDK}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_SDK}/platform-tools" >> $GITHUB_PATH

          # Accept licenses and install platform tools and SDK 34
          if [ -f "${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="sdkmanager"
          fi

          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          cache: true
          cache-dependency-path: android/go.sum

      - name: Install Gio Packaging Tool (gogio)
        run: |
          go install gioui.org/cmd/gogio@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Compile Android APK
        run: |
          mkdir -p build
          cd android
          echo "Building Android APK for ClipSync with gogio..."
          gogio -target android -appid com.diamond.clipsync -manifest AndroidManifest.xml -o ../build/ClipSync.apk .
          cp ../build/ClipSync.apk ../build/clipsync-android.apk
          cd ..
          ls -lh build/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipsync-android
          path: |
            build/ClipSync.apk
            build/clipsync-android.apk
          if-no-files-found: error
