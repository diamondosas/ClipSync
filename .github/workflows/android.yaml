name: Android Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version'
        required: false
        type: string
        default: '1.0.0'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "Setting up Android SDK environment..."
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> $GITHUB_ENV
          echo "${ANDROID_SDK}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_SDK}/platform-tools" >> $GITHUB_PATH

          # Accept licenses and install platform tools and SDK 34
          if [ -f "${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="sdkmanager"
          fi

          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          cache: true
          cache-dependency-path: android/go.sum

      - name: Install Gio Packaging Tool (gogio)
        run: |
          go install gioui.org/cmd/gogio@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build Gio Android Library (.aar)
        run: |
          cd android
          echo "Compiling Gio core into AAR archive..."
          # Remove main_app.go so only the minimal base main.go is compiled in package main
          rm -f main_app.go
          mkdir -p app/libs
          gogio -target android -buildmode archive -appid com.example.gioapp -arch arm,arm64 -tags="android" -ldflags="-s -w" -minsdk 21 -o app/libs/gioapp.aar .
          ls -lh app/libs/

      - name: Build Final Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          echo "Assembling Android APK..."
          ./gradlew assembleDebug assembleRelease --stacktrace

          mkdir -p ../build
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../build/ClipSync.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../build/ClipSync.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../build/ClipSync.apk
          else
            echo "Searching for generated APK files..."
            find app/build/outputs/apk -name "*.apk" -exec cp {} ../build/ClipSync.apk \;
          fi

          cp ../build/ClipSync.apk ../build/clipsync-android.apk
          cd ..
          ls -lh build/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipsync-android
          path: |
            build/ClipSync.apk
            build/clipsync-android.apk
          if-no-files-found: error
