name: Release Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read .github/VERSION
        id: version
        run: |
          if [ -f ".github/VERSION" ]; then
            VER=$(cat .github/VERSION | tr -d '[:space:]')
          else
            VER="1.0.0"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VER} (Tag: v${VER})"

  build-windows:
    name: Windows
    needs: get-version
    uses: ./.github/workflows/windows.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}

  build-linux:
    name: Linux
    needs: get-version
    uses: ./.github/workflows/linux.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}

  build-macos:
    name: macOS
    needs: get-version
    uses: ./.github/workflows/macos.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}

  release:
    name: Publish Release
    needs: [get-version, build-windows, build-linux, build-macos]
    if: always() && !cancelled() && needs.get-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: clipsync-*
          merge-multiple: true
          path: dist

      - name: Display Release Files
        run: |
          echo "Listing files to publish:"
          ls -la dist/

      - name: Publish or Overwrite GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: ClipSync ${{ needs.get-version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
