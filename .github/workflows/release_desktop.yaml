name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0). Defaults to .github/VERSION if empty.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  get-version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          elif [ -f ".github/VERSION" ]; then
            RAW_VER=$(cat .github/VERSION | tr -d '[:space:]')
          else
            RAW_VER="1.0.0"
          fi
          CLEAN_VER="${RAW_VER#v}"
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "tag=v${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Detected version: ${CLEAN_VER} (Tag: v${CLEAN_VER})"

  build-windows:
    name: Windows
    needs: get-version
    uses: ./.github/workflows/windows.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}

  build-linux:
    name: Linux
    needs: get-version
    uses: ./.github/workflows/linux.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}

  build-macos:
    name: macOS
    needs: get-version
    uses: ./.github/workflows/macos.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}

  release:
    name: Publish Desktop Release Assets
    needs: [get-version, build-windows, build-linux, build-macos]
    if: always() && !cancelled() && needs.get-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Desktop Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: clipsync-*
          merge-multiple: true
          path: dist

      - name: Display Release Files
        run: |
          echo "Listing desktop files to publish:"
          ls -la dist/

      - name: Publish or Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.get-version.outputs.tag }}"
          echo "Target tag: ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Uploading desktop assets without modifying release notes..."
            gh release upload "${TAG}" dist/* --clobber
          else
            echo "Creating initial release for ${TAG}..."
            gh release create "${TAG}" dist/* \
              --title "ClipSync ${TAG}" \
              --generate-notes \
              --latest
          fi
